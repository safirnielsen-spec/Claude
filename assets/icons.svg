<?xml version="1.0" encoding="UTF-8"?>
<!--
  CORE PARTNERS — Ikonsprite
  Alle ikoner er tegnet som <symbol> og genbruges i markup via:
  <svg class="icon"><use href="assets/icons.svg#icon-navn"></use></svg>
  Streger, ikke flader — matcher den skarpe, minimale grafiske stil.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Forsikring: skjold -->
  <symbol id="icon-shield" viewBox="0 0 48 48" fill="none">
    <path d="M24 5 L40 11 V22 C40 33 33 40.5 24 43 C15 40.5 8 33 8 22 V11 Z" stroke="currentColor" stroke-width="2"/>
    <path d="M16 23 L21.5 28.5 L33 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Serviceaftaler: skruenøgle -->
  <symbol id="icon-wrench" viewBox="0 0 48 48" fill="none">
    <path d="M31 9a9 9 0 0 0-11.9 11.9L7 33v6h6l12.1-12.1A9 9 0 0 0 37 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="16" r="2.3" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Facility: bygning -->
  <symbol id="icon-building" viewBox="0 0 48 48" fill="none">
    <rect x="10" y="6" width="20" height="36" stroke="currentColor" stroke-width="2"/>
    <rect x="30" y="18" width="10" height="24" stroke="currentColor" stroke-width="2"/>
    <path d="M15 13h4M21 13h4M15 20h4M21 20h4M15 27h4M21 27h4M15 34h4M21 34h4M34 24h3M34 31h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Ejendomsdrift: måler / gauge -->
  <symbol id="icon-gauge" viewBox="0 0 48 48" fill="none">
    <path d="M7 30a17 17 0 1 1 34 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 30 L32 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24" cy="30" r="2.4" fill="currentColor" stroke="none"/>
    <path d="M7 36h34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Pil, retning -->
  <symbol id="icon-arrow" viewBox="0 0 24 24" fill="none">
    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Pil ned (scrollindikator / chevron) -->
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none">
    <path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Flueben -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none">
    <path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Plus -->
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none">
    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Telefon -->
  <symbol id="icon-phone" viewBox="0 0 24 24" fill="none">
    <path d="M6.6 3.5l3 1.4-1.1 3.3c1.1 2.4 3 4.3 5.4 5.4l3.3-1.1 1.4 3v3.1a1.5 1.5 0 0 1-1.6 1.6C10.5 19.7 4.3 13.5 3.9 6.1A1.5 1.5 0 0 1 6.6 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Mail -->
  <symbol id="icon-mail" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="5" width="18" height="14" rx="1.5" stroke="currentColor" stroke-width="2"/>
    <path d="M3.5 6l8.5 7 8.5-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- LinkedIn -->
  <symbol id="icon-linkedin" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
    <path d="M7.5 10v6.2M7.5 7.4v.1M11.3 16.2V10M11.3 12.7c0-1.6 1-2.7 2.5-2.7s2.5 1 2.5 2.9v3.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Download -->
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none">
    <path d="M12 3v11.5M8 11l4 4 4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Menu (hamburger) -->
  <symbol id="icon-menu" viewBox="0 0 24 24" fill="none">
    <path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Luk / close -->
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none">
    <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Kalender -->
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none">
    <rect x="3.5" y="5" width="17" height="15" rx="1.5" stroke="currentColor" stroke-width="2"/>
    <path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Lup: benchmark/analyse -->
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none">
    <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
    <path d="M20 20l-4.8-4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Håndtryk: forhandling -->
  <symbol id="icon-handshake" viewBox="0 0 48 48" fill="none">
    <path d="M6 20l8-6 8 5 4-3 8 3 8 5-6 9-4-2-6 6-8-3-8-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M22 19l6 5-4 4M30 22l5 3-4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Graf-stigning: besparelse -->
  <symbol id="icon-trend" viewBox="0 0 48 48" fill="none">
    <path d="M6 34l11-11 8 8 17-17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 12h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

</svg>
