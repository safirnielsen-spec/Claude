<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Energimærke Feltbog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F5F7F3; --ink:#16201A; --ink-2:#4E5B52; --ink-3:#77837A;
  --line:#D2DAD3; --line-2:#E3E8E3;
  --accent:#0B6A4E; --accent-ink:#FFFFFF; --accent-soft:#DDEFE6;
  --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#FBE4E1; --ok:#1C7A3B; --ok-soft:#E0F2E5;
  --shadow:0 1px 2px rgba(22,32,26,.06),0 6px 18px rgba(22,32,26,.05);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1310; --surface:#151C18; --surface-2:#1B2420; --ink:#E3EAE5; --ink-2:#A2B0A6; --ink-3:#77857B;
    --line:#2C3832; --line-2:#222C27;
    --accent:#45C291; --accent-ink:#04120B; --accent-soft:#163A2C;
    --warn:#F2B650; --warn-soft:#3A2A0F; --bad:#FF8C7C; --bad-soft:#3E1915; --ok:#6BD58E; --ok-soft:#133321;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1310; --surface:#151C18; --surface-2:#1B2420; --ink:#E3EAE5; --ink-2:#A2B0A6; --ink-3:#77857B;
  --line:#2C3832; --line-2:#222C27;
  --accent:#45C291; --accent-ink:#04120B; --accent-soft:#163A2C;
  --warn:#F2B650; --warn-soft:#3A2A0F; --bad:#FF8C7C; --bad-soft:#3E1915; --ok:#6BD58E; --ok-soft:#133321;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.scale{display:grid;grid-template-rows:repeat(7,4px);gap:2px;flex:none}
.scale i{display:block;height:4px;border-radius:0 2px 2px 0}
.scale i:nth-child(1){width:10px;background:#0A8F4A}.scale i:nth-child(2){width:13px;background:#51B848}
.scale i:nth-child(3){width:16px;background:#BDD62E}.scale i:nth-child(4){width:19px;background:#F6E000}
.scale i:nth-child(5){width:22px;background:#FDB913}.scale i:nth-child(6){width:25px;background:#F37021}
.scale i:nth-child(7){width:28px;background:#ED1C24}
.mark h1{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.mark small{display:block;font:500 12px/1.3 var(--f-body);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.top .spacer{flex:1}
.ht-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.ht-chip b{font:500 15px var(--f-mono)}
.ht-chip span{font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11.5px var(--f-display);color:var(--ink-3);cursor:pointer;letter-spacing:.01em}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .badge{position:absolute;margin:-18px 0 0 22px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:var(--surface);font:600 10px/16px var(--f-mono);padding:0 4px}
.nav button{position:relative}

main{max-width:1080px;margin:0 auto;padding:20px 16px 0;display:flex;flex-direction:column;gap:22px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.page-h h2{font-size:26px;font-weight:800}
.page-h p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

section.block{display:flex;flex-direction:column;gap:12px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.block-h h3{font-size:18px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f > span em{font-style:normal;font-weight:400;color:var(--ink-3)}
.f.full{grid-column:1/-1}
input[type=text],input[type=date],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:16px}
textarea{min-height:76px;resize:vertical}
input.num-in{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.hint{font-size:12.5px;color:var(--ink-3);margin:0}
.unit{position:relative}
.unit input{padding-right:52px}
.unit i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:normal 12px var(--f-mono);color:var(--ink-3);pointer-events:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-display);cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* List items */
.items{display:flex;flex-direction:column;gap:8px}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.item[open]{box-shadow:var(--shadow)}
details.item > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px}
details.item > summary::-webkit-details-marker{display:none}
.sum-t{font:600 15px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-s{grid-column:1;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.sum-v{grid-row:1/3;grid-column:2;text-align:right;font:500 14px var(--f-mono);line-height:1.3}
.sum-v small{display:block;font-size:11px;color:var(--ink-3)}
.item-body{border-top:1px solid var(--line-2);padding:14px;display:flex;flex-direction:column;gap:14px}
.item-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.calcline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:7px;padding:8px 10px}
.calcline b{font:500 13px var(--f-mono);color:var(--ink)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);text-align:center;font-size:14px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font:600 11.5px var(--f-display);letter-spacing:.02em;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.banner b{font-family:var(--f-display)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 22px/1.2 var(--f-mono);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-2)}

/* Layer calc */
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(70px,.6fr) minmax(70px,.6fr) auto;gap:6px;align-items:center}
.layer input,.layer select{min-height:38px;font-size:15px}
.layer-h{font-size:11.5px;color:var(--ink-3);font-weight:600}
.sub{border:1px solid var(--line-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.sub h4{font-size:14px;font-weight:700}

/* Photos */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cat-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cat-h h4{font-size:15px;font-weight:700}
.cat-h p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ai-dot{position:absolute;right:4px;top:4px;background:var(--accent);color:var(--accent-ink);font:700 9px/1 var(--f-display);padding:3px 5px;border-radius:4px;letter-spacing:.04em}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.mini-photos{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-photos .thumb{width:54px;height:54px;aspect-ratio:auto}

/* Photo sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,12,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.sheet{align-items:center}.sheet-in{border-radius:14px;max-height:88vh}}
.sheet-img{width:100%;max-height:48vh;object-fit:contain;background:var(--surface-2);border-radius:8px}
.ai-box{border:1px solid var(--accent-soft);background:var(--surface-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-box p{margin:0}
.prop{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.prop:first-of-type{border-top:0}
.prop .k{font-size:12.5px;color:var(--ink-2)}
.prop .v{font:500 14px var(--f-mono)}
.prop .why{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:top}
th{font:700 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--surface-2)}
.kv{display:grid;grid-template-columns:minmax(150px,auto) 1fr;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kv div{padding:7px 12px;border-bottom:1px solid var(--line-2);font-size:14px;min-width:0;overflow-wrap:anywhere}
.kv div:nth-child(odd){color:var(--ink-2);background:var(--surface-2);font-size:13px}
.kv div:nth-last-child(-n+2){border-bottom:0}
.kv .v{font-family:var(--f-mono);font-size:13.5px}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.checks li .pill{flex:none;margin-top:1px}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sugg .panel{display:flex;flex-direction:column;gap:6px}
.sugg h4{font-size:15px}
.sugg p{margin:0;font-size:13.5px;color:var(--ink-2)}
.cases{display:flex;flex-direction:column;gap:6px}
.case{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.case.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.case b{font-family:var(--f-display)}
.case small{display:block;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  details.item[open] .item-body{animation:fade .16s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}
}
/* Guide */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps button{border:0;background:none;padding:0 0 6px;font:600 11.5px var(--f-display);color:var(--ink-3);border-bottom:4px solid var(--line);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps button.done{color:var(--ink-2);border-color:var(--accent-soft)}
.steps button.on{color:var(--accent);border-color:var(--accent)}
.qs{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qcard h3{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qcard h4{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.qcard > .hint{margin-top:-6px;font-size:13.5px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:600 14px/1.25 var(--f-display);cursor:pointer;text-align:left;color:var(--ink)}
.chip small{display:block;font:400 12px/1.3 var(--f-body);color:var(--ink-3);margin-top:2px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.era{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}
.era:empty{display:none}
.plan{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.next{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.counters{display:flex;flex-direction:column;gap:6px}
.counter{display:grid;grid-template-columns:1fr 44px 32px 44px;align-items:center;gap:6px}
.counter span b{font-family:var(--f-display);font-size:14.5px}
.counter span small{display:block;font-size:12px;color:var(--ink-3)}
.counter .btn{min-height:44px;padding:0;font-size:20px}
.counter > b{text-align:center;font-size:17px}
.ai-row{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ai-note{margin:0;font-size:13.5px;background:var(--surface-2);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 6px 6px 0}
.ai-note.err{border-color:var(--bad);color:var(--bad)}
.btn.busy{opacity:.7;pointer-events:none}
.q{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 12px/1 var(--f-display);cursor:pointer;padding:0;margin-left:4px;vertical-align:1px}
.help-t{margin:0;background:var(--accent-soft);color:var(--ink);padding:8px 10px;border-radius:6px;font-size:13px}
.hdr-ask{min-height:36px;padding:6px 12px}
.chat .msgs{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto}
.msg{padding:9px 12px;border-radius:10px;font-size:14.5px;white-space:pre-wrap;max-width:88%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-2)}
.chat-in{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{min-height:48px}
.smart{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.smart p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:52ch}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="mark">
    <div class="scale" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>Energimærke Feltbog</h1><small id="hdrCase">–</small></div>
  </div>
  <div class="spacer"></div>
  <div class="ht-chip" title="Samlet varmetab for klimaskærmen"><b id="hdrHT">–</b><span>H<sub>T</sub> W/K</span></div>
  <button type="button" class="btn sm pri hdr-ask" data-act="chat-open">Spørg</button>
</div></header>

<main id="main"></main>

<nav class="nav" aria-label="Sektioner"><div class="nav-in" id="nav"></div></nav>
<div id="sheet"></div>

<script>
"use strict";
/* ============ Hjælpere ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(/\s/g,'').replace(',','.'));};
const fmt=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('da-DK',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PhotoDB={mem:new Map(),db:null,
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('em10-feltbog',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){this.db=null;}},
  _tx(mode,fn){return new Promise((res,rej)=>{try{const t=this.db.transaction('f',mode);const st=t.objectStore('f');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);}catch(e){rej(e);}});},
  async put(id,d){this.mem.set(id,d);if(this.db){try{await this._tx('readwrite',s=>s.put(d,id));}catch(e){}}},
  async get(id){if(this.mem.has(id))return this.mem.get(id);if(!this.db)return null;try{const d=await this._tx('readonly',s=>s.get(id));if(d)this.mem.set(id,d);return d||null;}catch(e){return null;}},
  async del(id){this.mem.delete(id);if(this.db){try{await this._tx('readwrite',s=>s.delete(id));}catch(e){}}},
};

/* ============ Beregninger ============ */
const vArea=v=>num(v.b)*num(v.h)*(num(v.antal)||1);
const vPerim=v=>2*(num(v.b)+num(v.h))*(num(v.antal)||1);
const fBrutto=f=>f.mode==='lxh'?num(f.l)*num(f.h):num(f.areal);
const fFradrag=(c,f)=>c.vinduer.filter(v=>v.flade===f.id).reduce((s,v)=>s+(vArea(v)||0),0);
const fNetto=(c,f)=>fBrutto(f)-fFradrag(c,f);
const falsLength=c=>c.vinduer.reduce((s,v)=>s+(vPerim(v)||0),0);
function linjeL(c,l){return l.auto?falsLength(c):num(l.l);}
function lagU(f){
  const T=FLADE_TYPER[f.type]||FLADE_TYPER.ydervaeg;let R=T.rsi+T.rse,ok=false;
  for(const L of f.lag||[]){if(L.mat==='luft'){R+=.18;ok=true;continue;}const lam=L.mat==='egen'?num(L.lambda):(MATERIALER.find(m=>m[0]===L.mat)||[])[2];const d=num(L.d)/1000;if(lam>0&&d>0){R+=d/lam;ok=true;}}
  return ok?1/R:NaN;
}
function fladeB(c,id){const f=c.flader.find(x=>x.id===id);return f?num(f.b):1;}
function calc(c){
  const r={flader:0,vinduer:0,linjer:0,aFlade:0,aVindue:0};
  for(const f of c.flader){const a=fNetto(c,f),u=num(f.U),b=num(f.b);if(a>0)r.aFlade+=a;if(a>0&&u>=0&&b>=0)r.flader+=a*u*b;}
  for(const v of c.vinduer){const a=vArea(v),u=num(v.Uw),b=v.flade?fladeB(c,v.flade):1;if(a>0)r.aVindue+=a;if(a>0&&u>=0)r.vinduer+=a*u*(Number.isFinite(b)?b:1);}
  for(const l of c.linjetab){const L=linjeL(c,l),p=num(l.psi),b=num(l.b);if(L>0&&p>=0)r.linjer+=L*p*(Number.isFinite(b)?b:1);}
  r.HT=r.flader+r.vinduer+r.linjer;
  const A=num(c.bygning.areal);r.areal=A;
  r.HTm2=A>0?r.HT/A:NaN;
  r.dim=r.HT*32/1000; // kW ved 20/−12 °C
  r.vinduesAndel=A>0?r.aVindue/A:NaN;
  return r;
}

/* ============ Validering / mangler ============ */
function mangler(c){
  const m=[],B=c.bygning,has=t=>c.flader.some(f=>t.includes(f.type));
  if(!B.adresse)m.push(['Adresse mangler','guide']);
  if(!num(B.opfoert))m.push(['Opførelsesår mangler','guide']);
  if(!(num(B.areal)>0))m.push(['Opvarmet etageareal mangler','guide']);
  if(!has(['ydervaeg']))m.push(['Ingen ydervægge registreret','skaerm']);
  if(!has(['loft','skraavaeg','fladt']))m.push(['Loft/tag ikke registreret','skaerm']);
  if(!has(['terraen','kaelderg','etage_kaelder','gulv_ude']))m.push(['Gulv/terrændæk ikke registreret','skaerm']);
  if(!c.vinduer.length)m.push(['Ingen vinduer/døre registreret','skaerm']);
  c.flader.forEach(f=>{if(!(fBrutto(f)>0))m.push([`${f.navn||'Flade'}: areal mangler`,'skaerm']);if(!(num(f.U)>0))m.push([`${f.navn||'Flade'}: U-værdi mangler`,'skaerm']);if(fNetto(c,f)<0)m.push([`${f.navn||'Flade'}: vinduer er større end fladen`,'skaerm']);});
  c.vinduer.forEach(v=>{if(!(vArea(v)>0))m.push([`${v.navn||'Vindue'}: mål mangler`,'skaerm']);if(!(num(v.Uw)>0))m.push([`${v.navn||'Vindue'}: Uw mangler`,'skaerm']);if(!v.orient)m.push([`${v.navn||'Vindue'}: orientering mangler`,'skaerm']);});
  if(!c.linjetab.some(l=>l.type.startsWith('fund')))m.push(['Linjetab for fundament mangler','skaerm']);
  if(!c.varme.kilde)m.push(['Varmekilde ikke valgt','anlaeg']);
  if(['gas_kond','gas','olie','pille'].includes(c.varme.kilde)&&!num(c.varme.eta100))m.push(['Kedlens virkningsgrad mangler (typeskilt)','anlaeg']);
  if(['vp_lv','vp_jord'].includes(c.varme.kilde)&&!num(c.varme.scop))m.push(['Varmepumpens SCOP/COP mangler','anlaeg']);
  if(c.vent.type!=='naturlig'&&!num(c.vent.qm))m.push(['Mekanisk luftskifte (qm) mangler','anlaeg']);
  const cnt=k=>c.fotos.filter(p=>p.kategori===k).length;
  for(const[k,K]of Object.entries(FOTO_KAT))if(K.min&&cnt(k)<K.min)m.push([`Fotos: ${K.navn} (${cnt(k)}/${K.min})`,'fotos']);
  return m;
}

function skoenListe(c){
  const l=[...c.flader.filter(f=>f.skoen).map(f=>[`${f.navn}: konstruktion og areal`,'skaerm']),...c.vinduer.filter(v=>v.skoen).map(v=>[`${v.navn}: størrelse og rudetype`,'skaerm'])];
  if(c.varme.skoen)l.push(['Varmeanlæg: virkningsgrad/SCOP er standardværdier – aflæs typeskiltet','anlaeg']);
  if(c.vand.skoen)l.push(['Varmtvandsbeholder: varmetab er en standardværdi','anlaeg']);
  return l;
}
/* ============ Forbedringsforslag ============ */
function forslag(c){
  const out=[],kwh=dH=>dH*GRADDAGE*24/1000;
  const byType=t=>c.flader.filter(f=>t.includes(f.type));
  byType(['loft','skraavaeg','fladt']).forEach(f=>{const u=num(f.U),a=fNetto(c,f);if(u>.2&&a>0){const nu=.12,dH=a*(u-nu)*num(f.b);out.push({t:`Efterisolér ${f.navn.toLowerCase()}`,d:`Fra U ${fmt(u)} til ca. ${fmt(nu)} W/m²K (ca. 300–350 mm isolering).`,dH});}});
  byType(['ydervaeg']).forEach(f=>{const u=num(f.U),a=fNetto(c,f);if(u>=1&&/hul/i.test(f.preset||'')){const nu=.55,dH=a*(u-nu)*num(f.b);out.push({t:`Hulmursisolering: ${f.navn}`,d:`Indblæsning af granulat, U fra ${fmt(u)} til ca. ${fmt(nu)}.`,dH});}});
  byType(['etage_kaelder']).forEach(f=>{const u=num(f.U),a=fNetto(c,f);if(u>.5){const nu=.3,dH=a*(u-nu)*num(f.b);out.push({t:'Isolér loft i uopvarmet kælder',d:`Isolering under dæk, U fra ${fmt(u)} til ca. ${fmt(nu)}.`,dH});}});
  const gl=c.vinduer.filter(v=>num(v.Uw)>=2.2&&num(v.g)>0);
  if(gl.length){const dH=gl.reduce((s,v)=>s+vArea(v)*(num(v.Uw)-.9),0);out.push({t:'Udskift ældre vinduer',d:`${gl.length} vinduespost(er) med Uw ≥ 2,2. Ny 3-lags rude med varm kant: Uw ca. 0,9.`,dH});}
  const dr=c.vinduer.filter(v=>num(v.Uw)>=2.2&&!(num(v.g)>0));
  if(dr.length){const dH=dr.reduce((s,v)=>s+vArea(v)*(num(v.Uw)-1.0),0);out.push({t:'Udskift ældre yderdøre',d:'Nye isolerede døre, U ca. 1,0.',dH});}
  const V=c.varme,alder=num(V.aar)?new Date().getFullYear()-num(V.aar):0;
  if(V.kilde==='olie'||(['gas','gas_kond'].includes(V.kilde)&&alder>=15)||V.kilde==='el')out.push({t:'Skift til varmepumpe',d:`${KILDER[V.kilde]}${alder?`, ${alder} år gammel`:''}. Luft/vand-varmepumpe vurderes, evt. fjernvarme hvis muligt.`});
  if(V.kilde==='gas')out.push({t:'Kondenserende kedel',d:'Ikke-kondenserende gaskedel kan udskiftes, hvis varmepumpe ikke er realistisk.'});
  if(num(c.fordeling.roerL)>0&&!(num(c.fordeling.roerIso)>=30))out.push({t:'Isolér varmerør i uopvarmede rum',d:`${fmt(num(c.fordeling.roerL),0)} m rør med under 30 mm isolering.`});
  if(num(c.vand.isolering)>0&&num(c.vand.isolering)<40)out.push({t:'Ny varmtvandsbeholder',d:`Beholderen har kun ${c.vand.isolering} mm isolering.`});
  if(!(num(c.sol.pv_kwp)>0))out.push({t:'Solceller',d:'Ingen solceller registreret. Vurdér tagflade mod S/SØ/SV.'});
  return out.map(o=>({...o,kwh:o.dH?kwh(o.dH):null}));
}

function facades(g){const D=['N','NØ','Ø','SØ','S','SV','V','NV'],i=Math.max(0,D.indexOf(g.front||'S'));return [['forside','Forside',D[i],true],['bagside','Bagside',D[(i+4)%8],true],['gavl1','Gavl',D[(i+2)%8],false],['gavl2','Gavl',D[(i+6)%8],false]];}
const eraFor=y=>ERAS.find(e=>y<=e.til)||ERAS[ERAS.length-1];

function rudeFor(g,Y,E){
  if(g.glaslag==='1')return '1lag';if(g.glaslag==='1f')return '1lag_forsats';if(g.glaslag==='3')return '3lag';

function genPlan(c){
  const g=G(c),B=c.bygning,Y=num(B.opfoert)||1970,E=eraFor(Y),L=num(g.L),W=num(g.W);
  const P={ok:L>0&&W>0,E,Y,flader:[],vinduer:[],linjer:[]};
  if(!P.ok)return P;
  const mk=(navn,type,preset,o,skoen)=>{const R=libRow(type,preset);return Object.assign({id:uid(),navn,type,preset,konstr:R[1],U:dk(R[2]),b:dk(FLADE_TYPER[type].b),mode:'areal',l:'',h:'',areal:'',orient:'',lag:[],noter:skoen?`Skønnet ud fra byggeår ${Y} – kontrollér.`:'',skoen:!!skoen},o);};
  // Ydervægge
  const vk=g.vaeg&&g.vaeg!=='vedikke'?g.vaeg:'tegl';let wp=E.vaeg[vk];
  if(wp==='hul_uiso'&&g.hulmur==='ja')wp='hul_efter';
  const wSk=!g.vaeg||g.vaeg==='vedikke'||(wp==='hul_uiso'&&g.hulmur!=='nej');
  const hh=g.etager==='2'?5.4:2.7;
  for(const[k,n,o,long]of facades(g)){
    const f=mk(`Ydervæg ${n.toLowerCase()} ${o}`,'ydervaeg',wp,{fk:k,orient:o,mode:'lxh',l:dk(long?L:W),h:dk(hh)},wSk||g.etager==='1.5');

  // Loft / tag
  const cmMap={'0':'uiso','5':'i50','10':'i100','15':'i150','20':'i200','25':'i250','30':'i300','40':'i400'};
  const lp=cmMap[g.loftCm]||E.loft,lSk=!cmMap[g.loftCm];
  if(g.etager==='1.5'){
    const sk={uiso:'uiso',i50:'i50',i100:'i100',i150:'i150',i200:'i200',i250:'i200',i300:'i300',i400:'i300'}[lp];
    P.flader.push(mk('Loft (hanebånd)','loft',lp,{areal:r1(L*W*.35)},true));

function genApply(c){

    if(D){let used=false;for(const[f,v]of Object.entries(D))if(!V[f]){V[f]=v;used=true;}if(used)V.skoen=true;}
  }

function propLabel(felt,val){
  if(felt==='varme.kilde')return KILDER[val]||val;if(felt==='vent.type')return VENT[val]||val;if(felt==='element.rude')return (RUDER[val]||{}).navn||val;

  return String(val);
}

  const kedel=['gas_kond','gas','olie','pille'].includes(V.kilde);
  const varme=[['Varmekilde',KILDER[V.kilde]||''],['Fabrikat / model',[V.fabrikat,V.model].filter(Boolean).join(' ')],['Fremstillingsår',V.aar],V.effekt&&['Nominel effekt',`${d(V.effekt,1)} kW`],kedel&&['Virkningsgrad 100 % / 30 %',`${V.eta100||'–'} % / ${V.eta30||'–'} %`],kedel&&['Tomgangstab',V.tomgang?`${V.tomgang} %`:''],V.scop&&['SCOP / COP',V.scop],V.veksler&&['Fjernvarme',V.veksler],['Placering',V.placering==='uopvarmet'?'Uopvarmet rum':'Opvarmet rum'],['Styring',V.styring],['Supplerende varme',[V.suppl,V.supplNote].filter(Boolean).join(' – ')],['Fordelingsanlæg',F.system],['Fremløb / retur',`${F.fremloeb} / ${F.retur} °C`],['Termostatventiler',F.termostater],['Cirkulationspumpe',[F.pumpe,F.pumpeW&&`${F.pumpeW} W`,F.pumpeStyring].filter(Boolean).join(', ')],['Rør i uopvarmede rum',F.roerL?`${F.roerL} m, ${F.roerIso||0} mm isolering`:'']];

  const vent=[['Ventilationsform',VENT[Ve.type]],Ve.type==='naturlig'?['Naturlig vent. vinter',`${d(Ve.qn)} l/s m²`]:['Mekanisk qm',`${d(Ve.qm)} l/s m²`],Ve.type==='balanceret'&&['Varmegenvinding',`${Ve.vgv||'–'} %`],Ve.type!=='naturlig'&&['SEL',`${Ve.sel||'–'} kJ/m³`],Ve.type!=='naturlig'&&['Anlæg',[Ve.fabrikat,Ve.aar].filter(Boolean).join(', ')],['Infiltration',`${d(Ve.qinf)} l/s m²`]];

/* ============ Hændelser ============ */
function getItem(c,list,id){return (c[list]||[]).find(x=>x.id===id);}
function setPath(c,path,val){const p=path.split('.');if(['flader','vinduer','linjetab','fotos'].includes(p[0])){const it=getItem(c,p[0],p[1]);if(it)it[p[2]]=val;}else c[p[0]][p[1]]=val;}
const dk=n=>String(n).replace('.',',');
function onChanged(c,path,val){
  const p=path.split('.');
  if(p[0]==='flader'){const f=getItem(c,'flader',p[1]);
    if(p[2]==='preset'){const L=(LIB[f.type]||[]).find(x=>x[0]===val);if(L){f.U=dk(L[2]);f.konstr=L[1];}f.skoen=false;return true;}
    if(p[2]==='type'){f.b=dk(FLADE_TYPER[val].b);f.preset='';if(!f.navn||Object.values(FLADE_TYPER).some(t=>t.navn===f.navn))f.navn=FLADE_TYPER[val].navn;return true;}
    if(p[2]==='U'){return false;}
    if(p[2]==='mode')return true;
  }
  if(p[0]==='vinduer'){const v=getItem(c,'vinduer',p[1]);
    if(p[2]==='rude'){const R=RUDER[val];if(R&&val!=='egen'){v.Uw=dk(R.Uw);v.g=dk(R.g);v.Ff=dk(R.Ff);}v.skoen=false;return true;}
    if(p[2]==='flade'){const f=getItem(c,'flader',val);if(f&&f.orient&&!v.orient)v.orient=f.orient;return true;}
    if(p[2]==='orient')return true;
  }
  if(p[0]==='linjetab'&&p[2]==='type'){const l=getItem(c,'linjetab',p[1]),L=LINJETAB.find(x=>x[0]===val);if(L&&L[2]!=='')l.psi=dk(L[2]);if(!val.startsWith('fals'))l.auto=false;if(!l.navn||LINJETAB.some(x=>x[1]===l.navn)||['Fundament','Vinduesfalse'].includes(l.navn))l.navn=val.startsWith('fund')?'Fundament':val.startsWith('fals')?'Vinduesfalse':l.navn;return true;}
  if(p[0]==='varme'&&(p[1]==='kilde'||p[1]==='suppl'))return true;
  if(p[0]==='vand'&&p[1]==='cirk')return true;
  if(p[0]==='vent'&&p[1]==='type'){if(val==='balanceret'){if(!c.vent.qm)c.vent.qm='0,3';if(!c.vent.vgv)c.vent.vgv='80';if(!c.vent.sel)c.vent.sel='1,0';}if(val==='udsug'&&!c.vent.qm)c.vent.qm='0,3';return true;}
  if(p[0]==='fotos')return 'sheet';
  return false;
}
document.addEventListener('input',e=>{
  const t=e.target,c=cur();
  if(t.dataset.b){setPath(c,t.dataset.b,t.value);c.updated=Date.now();const q=t.dataset.b.split('.');if(['flader','vinduer'].includes(q[0])&&['U','Uw','l','h','areal','antal','b'].includes(q[2])){const it=getItem(c,q[0],q[1]);if(it)it.skoen=false;}if(t.tagName!=='SELECT'){save();updateCalcs();}}
  else if(t.dataset.lag){const[id,i,k]=t.dataset.lag.split(':');const f=getItem(c,'flader',id);if(f&&f.lag[i]){f.lag[i][k]=t.value;save();updateCalcs();}}
  else if(t.id==='apiKey'){lsSet(LS_KEY,t.value.trim());}
});
document.addEventListener('change',async e=>{
  const t=e.target,c=cur();
  if(t.tagName==='SELECT'&&t.dataset.b){setPath(c,t.dataset.b,t.value);const re=onChanged(c,t.dataset.b,t.value);save();if(re==='sheet'){vSheet();render(true);}else if(re)render(true);else updateCalcs();return;}
  if(t.tagName==='SELECT'&&t.dataset.lag){const[id,i,k]=t.dataset.lag.split(':');const f=getItem(c,'flader',id);f.lag[i][k]=t.value;save();render(true);return;}
  if(t.id==='apiModel'){lsSet(LS_MODEL,t.value);return;}
  if(t.dataset.aiGuide&&t.files&&t.files[0]){const f=t.files[0];t.value='';guideAIRun(c,t.dataset.aiGuide,f);return;}
  if(t.dataset.smart&&t.files&&t.files[0]){const f=t.files[0];t.value='';try{const data=await readImage(f);const id=uid();await PhotoDB.put(id,data);c.fotos.push({id,kategori:'andet',element:'',note:'',t:new Date().toLocaleString('da-DK'),ai:null});save();render(true);sheetPhoto=id;runAI(id,true);}catch(err){toast(err.message);}return;}
  if(t.dataset.fotoKat&&t.files&&t.files.length){await addPhotos(c,[...t.files],t.dataset.fotoKat,t.dataset.fotoEl||'');t.value='';return;}
  if(t.id==='importFile'&&t.files[0]){importCase(t.files[0]);t.value='';}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.open){d.open?openSet.add(d.dataset.open):openSet.delete(d.dataset.open);}},true);
document.addEventListener('click',async e=>{
  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){state.tab=tabBtn.dataset.tab;save();render();return;}

// Inde i Claude bruges brugerens egen Claude-konto (capability "sample"); ellers en valgfri API-nøgle.
let sampleFn=null,sampleImages=false,dlCap=null,aiBusy=false,aiErr='';
const guideAI={busy:'',msg:{}};
const apiKey=()=>(lsGet(LS_KEY)||'').trim();
const aiAvailable=()=>!!sampleFn||!!apiKey();
const aiImages=()=>(!!sampleFn&&sampleImages)||!!apiKey();
function dataURLtoBlob(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'image/jpeg'});}
function sampleMsg(e){return ({not_granted:'Du har ikke givet siden lov til at bruge Claude. Genindlæs siden og tillad det for at bruge AI.',sampling_disabled:'Claude er ikke tilgængelig for din konto.',rate_limited:'Der er sendt mange forespørgsler – vent lidt og prøv igen.',session_expired:'Log ind på Claude igen.',image_rejected:'Billedet kunne ikke bruges – prøv et andet foto.',images_unavailable:'Billedanalyse er ikke tilgængelig i denne visning.',refused:'Claude ville ikke svare på dette. Prøv at formulere det anderledes.',invalid_json:'Svaret kunne ikke læses – prøv igen.',empty_completion:'Der kom intet svar – prøv igen.',cancelled:'Stoppet.'})[e&&e.code]||'Der skete en fejl – prøv igen om lidt.';}
async function askAI(prompt,{images=[],json=true,onText,signal,turns}={}){
  if(sampleFn&&(!images.length||sampleImages)){
    const o={};if(images.length)o.images=images.map(dataURLtoBlob);if(onText)o.onText=onText;if(signal)o.signal=signal;if(!json||turns)o.cache=false;
    const input=turns||prompt;
    try{return json?await sampleFn.json(input,o):(await sampleFn(input,o)).text;}
    catch(e){const err=new Error(sampleMsg(e));err.code=e&&e.code;err.partial=e&&e.text;throw err;}
  }
  const key=apiKey();
  if(!key)throw new Error(sampleFn?'Billedanalyse kræver en API-nøgle i denne visning (se Mere).':'AI er ikke slået til. Åbn værktøjet i Claude-appen, eller indsæt en API-nøgle under Mere.');
  const msgs=(turns||[{role:'user',content:prompt}]).reduce((a,t)=>{const l=a[a.length-1];if(l&&l.role===t.role)l.content+='\n\n'+t.content;else a.push({role:t.role,content:t.content});return a;},[]);
  const last=msgs[msgs.length-1];last.content=[...images.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.split(',')[1]}})),{type:'text',text:last.content}];
  const messages=msgs;
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:lsGet(LS_MODEL)||'claude-opus-5',max_tokens:4000,fallbacks:'default',output_config:{effort:'medium'},messages})});}
  catch(e){throw new Error(e.name==='AbortError'?'Stoppet.':'Kunne ikke kontakte Anthropics API. Tjek netforbindelsen.');}
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(res.status===401?'API-nøglen blev afvist. Kontrollér den under Mere.':res.status===429?'For mange forespørgsler – prøv igen om lidt.':(j.error&&j.error.message)||`Fejl fra API (${res.status}).`);
  if(j.stop_reason==='refusal')throw new Error('Claude ville ikke svare på dette.');
  const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(!json){if(onText)onText({text:txt,delta:txt});return txt;}
  const s=txt.search(/[\[{]/),e=Math.max(txt.lastIndexOf('}'),txt.lastIndexOf(']'));
  if(s<0||e<s)throw new Error('Svaret kunne ikke læses – prøv igen.');
  return JSON.parse(txt.slice(s,e+1));
}

/* Spørg: chat med sagen som kontekst */
const chat={open:false,turns:[],busy:false,live:'',err:'',ctl:null};
const CHAT_REGLER=`Du er en tålmodig hjælper for en dansk energikonsulent under uddannelse, som ikke er byggeteknisk uddannet. Svar kort og konkret på dansk i almindeligt sprog. Undgå fagjargon – forklar et fagudtryk, hvis du bruger det. Når det handler om registrering, så sig præcist hvad personen skal kigge efter, måle eller fotografere, og hvor i værktøjet det skal ind (fanerne hedder Start/guide, Klimaskærm, Anlæg, Fotos, Energy10). Værktøjet samler data til energimærkning i programmet Energy10 (Be18-beregning). Hvis du ikke er sikker på en regel eller en standardværdi, så sig det og henvis til Håndbog for Energikonsulenter – opfind aldrig regler. Hold dig til ca. 150 ord, med mindre der spørges om mere.`;
function caseSummary(c){
  const B=c.bygning,r=calc(c);
  return [`Hus: ${ANVENDELSE[B.anvendelse]||''}, bygget ${B.opfoert||'?'}, ${B.areal||'?'} m², ${B.etager||'?'} etager.`,
    `Flader: ${c.flader.map(f=>`${f.navn} (${f.konstr||FLADE_TYPER[f.type].navn}, U ${f.U||'?'}, ${fmt(fNetto(c,f),1)} m²${f.skoen?', skønnet':''})`).join('; ')||'ingen'}.`,
    `Vinduer: ${c.vinduer.reduce((s,v)=>s+(+v.antal||0),0)} stk, ${fmt(r.aVindue,1)} m².`,
    `Varme: ${KILDER[c.varme.kilde]||'ikke valgt'} ${[c.varme.fabrikat,c.varme.aar].filter(Boolean).join(' ')}. Ventilation: ${VENT[c.vent.type]}. H_T ${fmt(r.HT,1)} W/K.`].join('\n');
}
async function chatSend(text){
  text=(text||'').trim();if(!text||chat.busy)return;
  const c=cur();chat.turns.push({role:'user',content:text});chat.busy=true;chat.live='';chat.err='';chat.ctl=new AbortController();vChat();
  const turns=[{role:'user',content:`${CHAT_REGLER}\n\nSagen lige nu:\n${caseSummary(c)}\n\nBrugeren står på fanen: ${state.tab}.`},...chat.turns.slice(-12)];
  try{
    const ans=await askAI(null,{json:false,turns,signal:chat.ctl.signal,onText:({text})=>{chat.live=text;const el=$('#chatLive');if(el)el.textContent=text;}});
    chat.turns.push({role:'assistant',content:ans});
  }catch(e){if(e.partial)chat.turns.push({role:'assistant',content:e.partial});if(e.code!=='cancelled')chat.err=e.message;}
  chat.busy=false;chat.live='';chat.ctl=null;vChat();
}
function vChat(){
  if(!chat.open){$('#sheet').innerHTML='';return;}
  const forslag=['Hvordan ser jeg, om der er hulmursisolering?','Hvad betyder U-værdi?','Hvilke fotos skal jeg tage?','Hvordan måler jeg et vindue?','Hvor finder jeg typeskiltet på et gasfyr?'];
  $('#sheet').innerHTML=`<div class="sheet" data-act="close-sheet"><div class="sheet-in chat" role="dialog" aria-modal="true" aria-label="Spørg">
    <div class="block-h"><h3>Spørg om sagen</h3><button class="btn sm" data-act="close-sheet">Luk</button></div>
    ${aiAvailable()?'':'<p class="hint" style="color:var(--bad)">AI er ikke slået til her. Åbn værktøjet i Claude-appen, eller indsæt en API-nøgle under Mere.</p>'}
    <div class="msgs">${chat.turns.length?'':'<p class="hint">Stil et spørgsmål – svaret tager højde for det, du har registreret på sagen.</p>'}
      ${chat.turns.map(t=>`<div class="msg ${t.role==='user'?'me':'ai'}">${esc(t.content)}</div>`).join('')}
      ${chat.busy?`<div class="msg ai" id="chatLive">${esc(chat.live||'Tænker …')}</div>`:''}
      ${chat.err?`<p class="hint" style="color:var(--bad)">${esc(chat.err)}</p>`:''}</div>
    ${chat.turns.length?'':`<div class="chips">${forslag.map(f=>`<button type="button" class="chip" data-act="chat-q" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div>`}
    <form class="chat-in" id="chatForm"><textarea id="chatIn" rows="2" placeholder="Skriv dit spørgsmål …"></textarea>
      ${chat.busy?'<button type="button" class="btn" data-act="chat-stop">Stop</button>':'<button type="submit" class="btn pri">Send</button>'}</form>
  </div></div>`;
  const m=$('.msgs');if(m)m.scrollTop=m.scrollHeight;
}

/* ============ Diverse ============ */
function slug(c){return (c.bygning.adresse||'sag').toLowerCase().replace(/[^a-z0-9æøå]+/g,'-').replace(/^-|-$/g,'').slice(0,40);}
async function copy(text){chat.open=false;try{await navigator.clipboard.writeText(text);toast('Kopieret – indsæt i Energy10 eller Excel');}catch(e){showText(text);}}
function showText(text){sheetPhoto=null;chat.open=false;$('#sheet').innerHTML=`<div class="sheet" data-act="close-sheet"><div class="sheet-in"><div class="block-h"><h3>Markér og kopiér</h3><button class="btn sm" data-act="close-sheet">Luk</button></div><textarea id="copyBox" style="min-height:50vh;font-family:var(--f-mono);font-size:13px">${esc(text)}</textarea></div></div>`;const t=$('#copyBox');t.focus();t.select();}
function download(name,text,type){
  if(dlCap){dlCap.save({filename:name,data:text}).then(()=>toast(`Gemt: ${name}`)).catch(e=>{if(e&&e.code!=='declined')showText(text);});return;}
  if(window.self!==window.top){showText(text);toast('Download er blokeret i denne visning – kopiér teksten i stedet.');return;}
  try{const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(`Gemmer ${name}`);}
  catch(e){showText(text);}
}
async function importCase(file){
  try{const j=JSON.parse(await file.text());if(j.format!=='em10-feltbog'||!j.case)throw new Error();const c=Object.assign(blankCase(),j.case);c.id=uid();c.example=false;
    if(j.photos){for(const p of c.fotos){if(j.photos[p.id])await PhotoDB.put(p.id,j.photos[p.id]);}}
    state.cases.unshift(c);state.cur=c.id;state.tab='guide';save();render();toast('Sag importeret');}
  catch(e){toast('Filen er ikke en eksport fra Feltbogen.');}
}
let toastT=null;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}

/* ============ Start ============ */
state=load();
if(!state.cases.find(c=>c.id===state.cur))state.cur=state.cases[0].id;
if(!NAV.some(n=>n[0]===state.tab))state.tab='guide';
render();
PhotoDB.open().then(()=>hydrateThumbs());
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    const[sm,dl]=await Promise.all([window.claude.use('sample').catch(()=>null),window.claude.use('downloads').catch(()=>null)]);
    sampleFn=sm;dlCap=dl;
    if(sm){try{const l=await sm.limits();sampleImages=!!(l&&l.images);}catch(e){sampleImages=false;}}
    const a=document.activeElement;if(!a||a===document.body)render(true);
  }catch(e){}
})();
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
</script>
</body>
